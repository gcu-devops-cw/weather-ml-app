name: CI

on:
  push:
    branches: [ main ]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app
  TAG: ${{ github.sha }}

jobs:
  build-test-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test
        run: python tests/smoke_test.py

      - name: Unit test
        run: python tests/unit_test.py

      - name: Integration test
        run: python tests/integration_test.py

      - name: Build Docker image
        run: docker build -t $IMAGE:$TAG .

      - name: Build test - container launches
        run: |
          docker run -d --name build-test $IMAGE:$TAG
          sleep 10
          docker exec build-test python --version
          docker ps
          docker rm -f build-test

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image to DockerHub
        run: |
          # Publish the commit-specific image used by CD.
          docker push "$IMAGE:$TAG"

          # Create the version 2 tag for the coursework demonstration.
          docker tag "$IMAGE:$TAG" "$IMAGE:v2"

          # Publish the version 2 image to Docker Hub.
          docker push "$IMAGE:v2"